<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AnythingLLM 文档上传</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 32px auto; padding: 0 16px; }
  h1 { font-size: 20px; }
  #ws { color: #555; margin: 12px 0; }
  .row { margin: 16px 0; }
  button { padding: 6px 14px; }
  pre { background: #f5f5f5; padding: 12px; border-radius: 4px; white-space: pre-wrap; word-break: break-all; }
  .ok { color: #1a7f37; } .err { color: #cf222e; }
  #key-bar { display: flex; gap: 8px; margin: 8px 0; align-items: center; font-size: 13px; color: #555; }
  #key-bar button { padding: 4px 10px; font-size: 12px; }

  /* 弹窗遮罩 */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center; z-index: 999;
  }
  .modal {
    background: #fff; border-radius: 8px; padding: 20px 24px;
    width: 380px; box-shadow: 0 10px 40px rgba(0,0,0,.15);
  }
  .modal h3 { margin: 0 0 12px 0; font-size: 16px; }
  .modal input[type="text"] {
    width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px;
    font-size: 14px; box-sizing: border-box; font-family: inherit;
  }
  .modal .actions { margin-top: 14px; text-align: right; }
  .modal .actions button { margin-left: 8px; }
  .modal-hint { font-size: 12px; color: #888; margin-top: 6px; }
</style>
</head>
<body>
<h1>AnythingLLM 文档上传</h1>
<div id="key-bar">
  <span id="key-status">密钥：未设置</span>
  <button id="btn-set-key">设置密钥</button>
  <button id="btn-clear-key">清除</button>
</div>
<div id="ws">目标工作区：加载中…</div>
<div class="row">
  <input type="file" id="file">
  <button id="up" disabled>上传并嵌入</button>
</div>
<pre id="out">等待上传…</pre>

<script>
const BASE = "http://localhost:3001";
const KEY_STORAGE_KEY = "anythingllm_api_key";
let slug = null;
let apiKey = localStorage.getItem(KEY_STORAGE_KEY) || "";

function headers() { return { "Authorization": "Bearer " + apiKey }; }

// 统一的安全输出：所有动态内容都用 textContent，避免 innerHTML 注入
function setStatus(el, text, cls, detail) {
  el.textContent = "";
  if (cls) {
    const span = document.createElement("span");
    span.className = cls;
    span.textContent = text;
    el.appendChild(span);
  } else {
    el.appendChild(document.createTextNode(text));
  }
  if (detail) el.appendChild(document.createTextNode("\n\n" + detail));
}

function updateKeyBar() {
  const status = document.getElementById("key-status");
  if (apiKey) {
    status.textContent = "密钥：已设置（" + apiKey.slice(0, 6) + "…" + apiKey.slice(-4) + "）";
  } else {
    status.textContent = "密钥：未设置";
  }
}

// 弹窗设置密钥
function promptForKey() {
  const mask = document.createElement("div");
  mask.className = "modal-mask";
  mask.innerHTML = `
    <div class="modal">
      <h3>输入 AnythingLLM API Key</h3>
      <input type="text" id="key-input" placeholder="sk-... 或 1N9HKPC-..." />
      <div class="modal-hint">密钥仅保存在当前浏览器 localStorage，不会上传到服务器。</div>
      <div class="actions">
        <button id="key-cancel">取消</button>
        <button id="key-ok">确定</button>
      </div>
    </div>
  `;
  document.body.appendChild(mask);
  const input = document.getElementById("key-input");
  input.focus();
  input.value = apiKey;

  function close() { mask.remove(); }
  document.getElementById("key-cancel").onclick = close;
  document.getElementById("key-ok").onclick = () => {
    const v = input.value.trim();
    if (!v) { alert("API Key 不能为空"); return; }
    apiKey = v;
    localStorage.setItem(KEY_STORAGE_KEY, apiKey);
    updateKeyBar();
    loadWorkspace();
    close();
  };
  mask.addEventListener("click", (e) => { if (e.target === mask) close(); });
  // Enter 确认
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("key-ok").click(); });
}

document.getElementById("btn-set-key").onclick = promptForKey;
document.getElementById("btn-clear-key").onclick = () => {
  if (confirm("确定要清除本地保存的 API Key 吗？")) {
    apiKey = "";
    localStorage.removeItem(KEY_STORAGE_KEY);
    updateKeyBar();
    setStatus(document.getElementById("ws"), "密钥已清除，请重新设置", "err");
    document.getElementById("up").disabled = true;
  }
};

async function loadWorkspace() {
  updateKeyBar();
  if (!apiKey) {
    // 首次打开：弹窗要求输入
    promptForKey();
    return;
  }
  try {
    const r = await fetch(BASE + "/api/v1/workspaces", { headers: headers() });
    const j = await r.json();
    const list = j.workspaces || [];
    if (!list.length) { setStatus(document.getElementById("ws"), "未找到工作区", "err"); return; }
    const first = list.reduce((a, b) => (b.id < a.id ? b : a));
    slug = first.slug;
    document.getElementById("ws").textContent = "目标工作区：" + first.name + "（" + slug + "）";
    document.getElementById("up").disabled = false;
  } catch (e) {
    setStatus(document.getElementById("ws"), "加载工作区失败：" + e.message, "err");
  }
}

document.getElementById("up").onclick = async () => {
  if (!apiKey) { promptForKey(); return; }
  const f = document.getElementById("file").files[0];
  const out = document.getElementById("out");
  if (!f) { setStatus(out, "请先选择文件", "err"); return; }
  if (!slug) { setStatus(out, "工作区未就绪", "err"); return; }
  out.textContent = "上传中…";
  const fd = new FormData();
  fd.append("file", f);
  fd.append("meta", JSON.stringify({}));
  try {
    const r = await fetch(BASE + "/api/v1/document/upload", { method: "POST", headers: headers(), body: fd });
    const j = await r.json();
    if (!j.success) {
      setStatus(out, "上传失败" + (j.error ? "：" + j.error : ""), "err", JSON.stringify(j, null, 2));
      return;
    }
    const adds = (j.documents || []).map(d => d.location).filter(Boolean);
    setStatus(
      out,
      "上传成功（" + adds.length + " 个），正在向量化嵌入…",
      "ok",
      (j.documents || []).map(d => d.name + " → " + d.location).join("\n")
    );

    const er = await fetch(BASE + "/api/v1/workspace/" + slug + "/update-embeddings", {
      method: "POST",
      headers: Object.assign(headers(), { "Content-Type": "application/json" }),
      body: JSON.stringify({ adds: adds, deletes: [] })
    });
    const ej = await er.json();
    const embedOk = er.ok && !ej.error;
    setStatus(
      out,
      embedOk ? "上传 + 嵌入完成" : "嵌入失败" + (ej.error ? "：" + ej.error : ""),
      embedOk ? "ok" : "err",
      "--- 上传 ---\n" + (j.documents || []).map(d => d.name + " → " + d.location).join("\n") +
        "\n\n--- 嵌入响应 ---\n" + JSON.stringify(ej, null, 2)
    );
  } catch (e) {
    setStatus(out, "请求失败：" + e.message, "err");
  }
};

loadWorkspace();
</script>
</body>
</html>
