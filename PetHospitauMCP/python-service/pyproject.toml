[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-hospital-mcp"
version = "1.0.0"
description = "MCP service exposing the Go Pet Hospital REST API (GET /api/v1/pets) to AI agents. Stateless Streamable HTTP, MCP 2026-07-28, mcp SDK 2.0.0."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "pet-hospital-mcp" }]
keywords = ["mcp", "model-context-protocol", "pet-hospital", "ai-agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "mcp==2.0.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "structlog>=24.1,<25",
    "uvicorn>=0.30,<1.0",
    "starlette>=0.37,<1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1.0",
    "respx>=0.21,<1.0",
    "asgi-lifespan>=2.0,<3",
]

[project.scripts]
pet-hospital-mcp = "pet_hospital_mcp.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
